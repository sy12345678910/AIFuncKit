[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intent-c"
dynamic = ["version"]
description = "A Single-Pass Semantic Compiler and high-performance NumPy-driven automation orchestrator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sasha Yuvko", email = "sasha.yuvko2@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.19.0",
    "ollama>=0.4.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.version]
path = "src/intent_c/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_c"]
