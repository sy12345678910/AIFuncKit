[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aifunckit"
dynamic = ["version"]
description = "A lightweight Python framework that converts user prompts into parallel function calls using Pydantic and NumPy."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sasha Yuvko", email = "sasha.yuvko2@gmail.com"}
]
keywords = ["artificial-inteligence-function-kit", "ai-orchestrator", "local-llm", "numpy", "pydantic"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.19.0",
    "ollama>=0.4.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
blm_routing = ["laya>=0.4.0"]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/sy12345678910/IntentC/"
Bug-Tracker = "https://github.com/sy12345678910/IntentC/issues"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_c"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

